name: publish
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # A broken publish is worse than a late one, so the suite runs first.
      - name: Test
        run: pnpm run test

      - name: Unset NODE_AUTH_TOKEN
        run: unset NODE_AUTH_TOKEN

      - name: Publish
        run: npm publish --access public --provenance --no-git-checks
